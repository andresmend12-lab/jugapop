name: Comprobar stock

on:
  schedule:
    # Cada ronda se queda ~55 min comprobando una vez por minuto y al terminar
    # lanza la siguiente (paso «Encadenar»). GitHub retrasa mucho los horarios
    # programados, así que este cron es solo un respaldo por si la cadena se corta.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar notificación de prueba'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # Las pruebas van aparte para no esperar a que termine la ronda en marcha.
  group: check-stock-${{ inputs.test == true && 'test' || 'loop' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar cada minuto
        env:
          VAPID_PUBLIC_KEY: BHQ23UcdZ-yCvAArJDx-QmXQ7qdwv2N-3phvqa2hIYIuzDPTbR_J9yqngFHI8NzcPHax0ow8qFffvrCG9Md_6ls
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://github.com/andresmend12-lab/jugapop
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test == true }}
          LOOP_MINUTES: 55
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + LOOP_MINUTES * 60))
          while :; do
            # Recoge cambios (p. ej. productos nuevos en products.json) sin esperar a la siguiente ronda.
            git pull -q --rebase origin main || true
            node check.mjs || true
            git add docs/status.json docs/img
            if ! git diff --cached --quiet; then
              git commit -qm "Estado de stock actualizado"
              git pull -q --rebase origin main && git push -q || echo "::warning::No se pudo guardar el estado"
            fi
            if [ "$TEST_NOTIFICATION" = "true" ] || [ $SECONDS -ge $end ]; then break; fi
            sleep 60
          done
      - name: Encadenar la siguiente ronda
        # Si cancelas una ronda a mano, la cadena se para (el cron la reanudará más tarde).
        if: ${{ !cancelled() && inputs.test != true }}
        run: gh workflow run check-stock.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
