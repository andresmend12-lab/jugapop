name: Comprobar stock

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar notificación de prueba'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar producto
        run: node check.mjs
        env:
          VAPID_PUBLIC_KEY: BHQ23UcdZ-yCvAArJDx-QmXQ7qdwv2N-3phvqa2hIYIuzDPTbR_J9yqngFHI8NzcPHax0ow8qFffvrCG9Md_6ls
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://github.com/andresmend12-lab/jugapop
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test == true }}
      - name: Guardar estado
        run: |
          git add docs/status.json docs/img
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
            git commit -m "Estado de stock actualizado"
            git push
          fi
