name: Probar una página

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL del producto'
        required: true
      texto:
        description: 'Texto a buscar en la respuesta (opcional)'
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node probe.mjs "$URL" "$TEXTO"
        env:
          URL: ${{ inputs.url }}
          TEXTO: ${{ inputs.texto }}
